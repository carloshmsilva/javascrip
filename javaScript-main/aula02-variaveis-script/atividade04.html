<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h3 class="d-block p-2 text-bg-primary"> Atividade 04</h3>

    <script>

        

        produto = prompt("Digite seu produto: ");
        preco = prompt("Digite o preço: ");
        quantity = prompt("Digite a quantidade: ");
        valor = null
        valor = (preco * quantity)
        document.write(
            `<table class="table table-dark table-borderless">

        <table>
                <tr>
                    <th>Produto</th>
                    <th>Preço</th>
                    <th>Quantidade</th>
                    <th>Valor</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>${produto}</td>
                    <td>${preco}</td>
                    <td>${quantity}</td>
                    <td>${valor}</td>
                </tr>

            </tbody>

        </table>`);
            console.log(`Produto: ${produto} - ${typeof produto} \n
            Preço: ${preco} - ${typeof preco} \n
            Quantidade: ${quantity} - ${typeof quantity}
            valor: ${valor} - ${typeof valor}
            `)
        
        
        

    </script>







    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
